<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seraph's Last Stand: Web Remake</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; cursor: none; outline: none; }
  #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
          color: #e8dcc0; font: 22px Georgia, serif; letter-spacing: 1px; pointer-events: none; }
  #err { position: fixed; left: 8px; bottom: 8px; right: 8px; max-height: 40%; overflow: auto; color: #ffb3b3;
         font: 13px monospace; white-space: pre-wrap; background: rgba(40,0,0,0.85); padding: 8px; display: none; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="boot">Loading…</div>
<div id="err"></div>
<script>
  // show uncaught errors on screen (helps when running from file://)
  window.addEventListener('error', function (e) {
    var el = document.getElementById('err'); el.style.display = 'block';
    el.textContent += (e.message || e) + (e.filename ? '  @ ' + e.filename.split('/').pop() + ':' + e.lineno : '') + '\n';
  });
</script>
<!-- data: gameplay facts selected from the original game (numbers, shapes, timings) -->
<script src="data/facts.js"></script>
<!-- engine -->
<script src="js/engine/core.js"></script>
<script src="js/engine/objects.js"></script>
<script src="js/engine/transform.js"></script>
<script src="js/engine/physics.js"></script>
<script src="js/engine/input.js"></script>
<script src="assets/sprites/manifest.js"></script>
<script src="js/engine/assets.js"></script>
<script src="js/engine/audio.js"></script>
<script src="js/engine/render.js"></script>
<script src="js/engine/ui.js"></script>
<script src="js/engine/loop.js"></script>
<!-- game -->
<script src="js/game/sls.js"></script>
<script src="js/game/lang_en.js"></script>
<script src="js/game/lang_pt.js"></script>
<script src="js/game/art.js"></script>
<script src="js/game/sprites.js"></script>
<script src="js/game/world.js"></script>
<script src="js/game/player.js"></script>
<script src="js/game/enemies.js"></script>
<script src="js/game/projectiles.js"></script>
<script src="js/game/waves.js"></script>
<script src="js/game/items.js"></script>
<script src="js/game/shop.js"></script>
<script src="js/game/progression.js"></script>
<script src="js/game/hud.js"></script>
<script src="js/game/menus.js"></script>
<script src="js/game/main.js"></script>
</body>
</html>
